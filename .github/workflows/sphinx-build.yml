name: Build Docs

on:
  push:
    branches:
      - '*'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set OUTPUT_FOLDER
      id: branch_name
      run: |
        OUTPUT_FOLDER="docs/_build"
        echo "OUTPUT_FOLDER=${OUTPUT_FOLDER}" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Documentation for all branches
      run: |
        OUTPUT_FOLDER="docs/_build"
        failed_branches=()

        branches=($(git ls-remote --heads origin | cut -f2 | cut -d'/' -f3))

        for branch in "${branches[@]}"; do
          echo "Building documentation for: $branch"
          git fetch origin "$branch"
          git checkout "$branch"

          python -m venv ".venv-${branch}"
          source ".venv-${branch}/bin/activate"
          pip install --upgrade pip
          pip install -r requirements.txt
          deactivate

          if [ "$branch" == "main" ]; then
            target="${OUTPUT_FOLDER}"
          else
            target="${OUTPUT_FOLDER}/${branch}"
            mkdir -p "$target"
          fi

          # Run sphinx but don't let it kill the loop
          if ! ".venv-${branch}/bin/sphinx-build" -b html source "$target"; then
            echo "::warning::Documentation build failed for branch: $branch"
            failed_branches+=("$branch")
            # Clean up partial output so a broken build isn't deployed
            rm -rf "$target"
          fi
        done

        touch "${OUTPUT_FOLDER}/.nojekyll"

        # Fail the step after all branches are attempted, but only
        # if the *current* branch (the one that triggered this run) failed
        for branch in "${failed_branches[@]}"; do
          if [ "$branch" == "${{ github.ref_name }}" ]; then
            echo "::error::The triggering branch '$branch' failed to build."
            exit 1
          fi
        done

        # Warn about other failures but don't block deployment
        if [ ${#failed_branches[@]} -gt 0 ]; then
          echo "::warning::Some branches failed to build: ${failed_branches[*]}"
        fi


      #  echo "::set-output name=docs_folder::${OUTPUT_FOLDER}"  # Set output for deploy job
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        name: github-pages
        path: ${{ env.OUTPUT_FOLDER}}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy to GitHub Pages while maintaining the previous deployment
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: github-pages
